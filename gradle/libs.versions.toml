[versions]
agp = "8.13.2"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.58"
hiltNavigationCompose = "1.2.0"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2026.06.01"
# Material3 is pinned explicitly (outside the BOM): the BOM's 1.4.0 keeps the
# Expressive API internal. 1.5.0-alpha18 is the newest release whose
# material3-window-size-class still declares minCompileSdk 35 / minAGP 8.6.
# See PLAN.md ADR-2 and Appendix A A13.
material3 = "1.5.0-alpha18"
navigation = "2.8.5"
lifecycle = "2.8.7"
# Room 2.6.1 predates KSP2; our A9 toolchain (Kotlin 2.4.21 / KSP 2.3.12) runs KSP2 only, and Room
# added KSP2 support in 2.7.0. 2.8.5 (Sep 2026) is the current stable, built for compileSdk 36 /
# Kotlin 2.0+. User-approved 2026-10-12. See PLAN.md ADR-4 / Appendix A A16.
room = "2.8.5"
coroutines = "1.9.0"
datastore = "1.1.1"
documentfile = "1.0.1"
poiAndroid = "3.17"
vico = "2.0.0-alpha.2"
kotlinxSerialization = "1.7.3"
splashscreen = "1.0.1"
junit4 = "4.13.2"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
robolectric = "4.14.1"
turbine = "1.2.0"
mockk = "1.13.13"
truth = "1.4.4"

[libraries]
# --- AndroidX core / lifecycle ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

# --- Compose (versions resolved by the BOM) ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- Navigation ---
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# --- DI ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Room ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- Coroutines / DataStore / Serialization ---
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- Excel / SAF / Charts ---
poi-android = { module = "com.github.SUPERCILEX.poi-android:poi", version.ref = "poiAndroid" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# --- Test ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[bundles]
compose = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-foundation", "compose-animation", "compose-material3", "compose-material-icons-extended"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
test = ["junit4", "truth", "turbine", "mockk", "kotlinx-coroutines-test", "robolectric", "androidx-test-core", "androidx-test-ext-junit", "androidx-room-testing"]
androidTest = ["androidx-test-ext-junit", "androidx-test-runner", "androidx-espresso-core", "compose-ui-test-junit4"]