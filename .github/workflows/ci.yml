name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # GitHub-hosted runners ship cmdline-tools; accept licenses and ensure
          # platform 36 + build-tools are present (AGP auto-installs as fallback).
          SDKMANAGER=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace